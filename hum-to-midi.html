<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hum to MIDI Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.1rem; opacity: 0.9; }
        main { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .controls { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; min-width: 120px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.primary { background: #4CAF50; color: white; }
        .btn.primary:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
        .btn.secondary { background: #f44336; color: white; }
        .btn.secondary:hover:not(:disabled) { background: #da190b; transform: translateY(-2px); }
        .btn.success { background: #2196F3; color: white; }
        .btn.success:hover:not(:disabled) { background: #1976D2; transform: translateY(-2px); }
        .status { text-align: center; margin-bottom: 25px; }
        #statusText { font-size: 1.1rem; margin-bottom: 10px; font-weight: 500; }
        .audio-level { width: 300px; height: 20px; background: #e0e0e0; border-radius: 10px; margin: 0 auto; overflow: hidden; }
        .level-bar { height: 100%; background: linear-gradient(90deg, #4CAF50, #FFC107, #f44336); width: 0%; transition: width 0.1s ease; border-radius: 10px; }
        .current-note { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; font-size: 1.2rem; }
        .label { font-weight: 600; color: #666; }
        .note-value { font-size: 2rem; font-weight: bold; color: #2196F3; min-width: 80px; text-align: center; }
        .freq-value { color: #666; font-size: 1rem; }
        .detected-notes h3 { margin-bottom: 15px; color: #333; text-align: center; }
        .notes-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 50px; padding: 20px; background: #f5f5f5; border-radius: 8px; border: 1px dashed #ccc; }
        .note-item { background: #2196F3; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hum to MIDI Converter</h1>
            <p>Hum into your microphone and watch it convert to musical notation!</p>
        </header>
        <main>
            <div class="controls">
                <button id="startBtn" class="btn primary">Start Recording</button>
                <button id="stopBtn" class="btn secondary" disabled>Stop Recording</button>
                <button id="clearBtn" class="btn secondary">Clear</button>
                <button id="downloadMidiBtn" class="btn success" disabled>Download MIDI</button>
            </div>
            <div class="status">
                <div id="statusText">Click "Start Recording" to begin</div>
                <div class="audio-level">
                    <div id="audioLevelBar" class="level-bar"></div>
                </div>
            </div>
            <div class="current-note">
                <span class="label">Current Note:</span>
                <span id="currentNote" class="note-value">-</span>
                <span id="currentFreq" class="freq-value">- Hz</span>
            </div>
            <div class="detected-notes">
                <h3>Detected Notes</h3>
                <div id="notesList" class="notes-list"></div>
            </div>
        </main>
    </div>
    
    <script>
        // Simple MIDI file generator
        class SimpleMidiGenerator {
            constructor() {
                this.ticksPerQuarter = 480;
            }

            generateMidiFile(notes) {
                if (!notes || notes.length === 0) {
                    return null;
                }

                const header = this.createMidiHeader();
                const track = this.createMidiTrack(notes);
                const midiData = this.combineArrays(header, track);
                return this.arrayToDataUri(midiData);
            }

            createMidiHeader() {
                return [
                    0x4D, 0x54, 0x68, 0x64,
                    0x00, 0x00, 0x00, 0x06,
                    0x00, 0x00,
                    0x00, 0x01,
                    0x01, 0xE0
                ];
            }

            createMidiTrack(notes) {
                const trackData = [];
                trackData.push(...[0x4D, 0x54, 0x72, 0x6B]);
                const lengthPosition = trackData.length;
                trackData.push(0x00, 0x00, 0x00, 0x00);
                
                const trackEvents = [];
                trackEvents.push(...this.createTempoEvent());
                
                const sortedNotes = [...notes].sort((a, b) => a.startTime - b.startTime);
                let currentTime = 0;
                
                sortedNotes.forEach(note => {
                    const startTicks = Math.round(note.startTime * this.ticksPerQuarter * 2);
                    const durationTicks = Math.round(note.duration * this.ticksPerQuarter * 2);
                    const deltaTime = startTicks - currentTime;
                    
                    trackEvents.push(...this.encodeVariableLength(deltaTime));
                    trackEvents.push(0x90, note.midi, note.velocity || 80);
                    trackEvents.push(...this.encodeVariableLength(durationTicks));
                    trackEvents.push(0x80, note.midi, 0x40);
                    
                    currentTime = startTicks + durationTicks;
                });
                
                trackEvents.push(0x00, 0xFF, 0x2F, 0x00);
                trackData.push(...trackEvents);
                
                const trackLength = trackEvents.length;
                trackData[lengthPosition] = (trackLength >> 24) & 0xFF;
                trackData[lengthPosition + 1] = (trackLength >> 16) & 0xFF;
                trackData[lengthPosition + 2] = (trackLength >> 8) & 0xFF;
                trackData[lengthPosition + 3] = trackLength & 0xFF;
                
                return trackData;
            }

            createTempoEvent() {
                const microsecondsPerQuarter = Math.round(60000000 / 120);
                return [
                    0x00,
                    0xFF, 0x51, 0x03,
                    (microsecondsPerQuarter >> 16) & 0xFF,
                    (microsecondsPerQuarter >> 8) & 0xFF,
                    microsecondsPerQuarter & 0xFF
                ];
            }

            encodeVariableLength(value) {
                const result = [];
                result.unshift(value & 0x7F);
                value >>= 7;
                while (value > 0) {
                    result.unshift((value & 0x7F) | 0x80);
                    value >>= 7;
                }
                return result;
            }

            combineArrays(...arrays) {
                const result = [];
                for (const array of arrays) {
                    result.push(...array);
                }
                return result;
            }

            arrayToDataUri(byteArray) {
                const binaryString = String.fromCharCode.apply(null, byteArray);
                const base64 = btoa(binaryString);
                return `data:audio/midi;base64,${base64}`;
            }
        }

        // Pitch detector
        class PitchDetector {
            constructor(audioContext, sampleRate = 44100) {
                this.audioContext = audioContext;
                this.sampleRate = sampleRate;
                this.bufferSize = 4096;
                this.threshold = 0.01;
                this.noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            }

            detectPitch(audioBuffer) {
                const data = new Float32Array(audioBuffer);
                const volume = this.getVolume(data);
                if (volume < this.threshold) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }

                this.applyHammingWindow(data);
                const autocorrelation = this.autocorrelate(data);
                const period = this.findBestPeriod(autocorrelation);
                
                if (period === -1) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }
                
                const frequency = this.sampleRate / period;
                if (frequency < 80 || frequency > 1000) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }
                
                const note = this.frequencyToNote(frequency);
                const confidence = autocorrelation[period];
                
                return { frequency, note, confidence, volume };
            }

            getVolume(data) {
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i] * data[i];
                }
                return Math.sqrt(sum / data.length);
            }

            applyHammingWindow(data) {
                for (let i = 0; i < data.length; i++) {
                    data[i] *= 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (data.length - 1));
                }
            }

            autocorrelate(data) {
                const autocorrelation = new Float32Array(data.length);
                
                for (let lag = 0; lag < data.length; lag++) {
                    let sum = 0;
                    for (let i = 0; i < data.length - lag; i++) {
                        sum += data[i] * data[i + lag];
                    }
                    autocorrelation[lag] = sum / (data.length - lag);
                }
                
                const maxVal = Math.max(...autocorrelation);
                if (maxVal > 0) {
                    for (let i = 0; i < autocorrelation.length; i++) {
                        autocorrelation[i] /= maxVal;
                    }
                }
                
                return autocorrelation;
            }

            findBestPeriod(autocorrelation) {
                const minPeriod = Math.floor(this.sampleRate / 1000);
                const maxPeriod = Math.floor(this.sampleRate / 80);
                
                let bestPeriod = -1;
                let bestCorrelation = 0.3;
                
                for (let period = minPeriod; period < Math.min(maxPeriod, autocorrelation.length); period++) {
                    if (autocorrelation[period] > bestCorrelation) {
                        if (period === 0 || 
                            (autocorrelation[period] > autocorrelation[period - 1] && 
                             autocorrelation[period] > autocorrelation[period + 1])) {
                            bestCorrelation = autocorrelation[period];
                            bestPeriod = period;
                        }
                    }
                }
                
                return bestPeriod;
            }

            frequencyToNote(frequency) {
                const A4 = 440;
                const noteNumber = Math.round(12 * Math.log2(frequency / A4) + 69);
                const octave = Math.floor((noteNumber - 12) / 12);
                const noteIndex = (noteNumber - 12) % 12;
                
                return {
                    name: this.noteNames[noteIndex],
                    octave: octave,
                    midi: noteNumber,
                    frequency: frequency
                };
            }
        }

        // MIDI converter
        class MidiConverter {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.noteStartTime = null;
                this.minNoteDuration = 0.1;
                this.pitchStabilityThreshold = 0.5;
                this.recentPitches = [];
                this.maxRecentPitches = 10;
            }

            processPitchDetection(pitchResult, timestamp) {
                const { frequency, note, confidence, volume } = pitchResult;
                
                if (!note || confidence < 0.4 || volume < 0.01) {
                    this.endCurrentNote(timestamp);
                    return;
                }

                this.recentPitches.push({ note: note.midi, timestamp, confidence });
                if (this.recentPitches.length > this.maxRecentPitches) {
                    this.recentPitches.shift();
                }

                const stablePitch = this.getStablePitch();
                if (!stablePitch) {
                    return;
                }

                if (this.currentNote && Math.abs(this.currentNote.midi - stablePitch) <= 1) {
                    return;
                }

                this.endCurrentNote(timestamp);
                this.startNewNote(stablePitch, timestamp, confidence);
            }

            getStablePitch() {
                if (this.recentPitches.length < 3) {
                    return null;
                }

                const pitchCounts = {};
                this.recentPitches.forEach(p => {
                    const roundedPitch = Math.round(p.note);
                    if (!pitchCounts[roundedPitch]) {
                        pitchCounts[roundedPitch] = { count: 0, totalConfidence: 0 };
                    }
                    pitchCounts[roundedPitch].count++;
                    pitchCounts[roundedPitch].totalConfidence += p.confidence;
                });

                let bestPitch = null;
                let bestScore = 0;
                
                for (const [pitch, data] of Object.entries(pitchCounts)) {
                    const score = (data.count / this.recentPitches.length) * (data.totalConfidence / data.count);
                    if (score > bestScore && score > this.pitchStabilityThreshold) {
                        bestScore = score;
                        bestPitch = parseInt(pitch);
                    }
                }

                return bestPitch;
            }

            startNewNote(midiNote, timestamp, confidence) {
                this.currentNote = {
                    midi: midiNote,
                    startTime: timestamp,
                    confidence: confidence
                };
                this.noteStartTime = timestamp;
            }

            endCurrentNote(timestamp) {
                if (!this.currentNote || !this.noteStartTime) {
                    return;
                }

                const duration = timestamp - this.noteStartTime;
                if (duration >= this.minNoteDuration) {
                    this.notes.push({
                        midi: this.currentNote.midi,
                        startTime: this.noteStartTime,
                        duration: duration,
                        velocity: Math.min(127, Math.max(40, Math.round(this.currentNote.confidence * 127)))
                    });
                }

                this.currentNote = null;
                this.noteStartTime = null;
            }

            finalize(timestamp) {
                this.endCurrentNote(timestamp);
                return this.notes.slice();
            }

            clear() {
                this.notes = [];
                this.currentNote = null;
                this.noteStartTime = null;
                this.recentPitches = [];
            }

            generateMidiFile(notes = null) {
                const notesToUse = notes || this.notes;
                if (notesToUse.length === 0) {
                    return null;
                }
                const midiGenerator = new SimpleMidiGenerator();
                return midiGenerator.generateMidiFile(notesToUse);
            }

            midiNumberToNoteName(midiNumber) {
                const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const octave = Math.floor((midiNumber - 12) / 12);
                const noteIndex = (midiNumber - 12) % 12;
                return noteNames[noteIndex] + octave;
            }

            getNotes() {
                return this.notes.slice();
            }
        }

        // Main app
        class HumToMidiApp {
            constructor() {
                this.audioContext = null;
                this.microphone = null;
                this.analyser = null;
                this.pitchDetector = null;
                this.midiConverter = null;
                this.isRecording = false;
                this.animationId = null;
                this.startTime = null;
                this.initializeUI();
            }

            initializeUI() {
                document.getElementById('startBtn').addEventListener('click', () => this.startRecording());
                document.getElementById('stopBtn').addEventListener('click', () => this.stopRecording());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearNotes());
                document.getElementById('downloadMidiBtn').addEventListener('click', () => this.downloadMidi());
                this.updateStatus('Click "Start Recording" to begin');
            }

            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        } 
                    });
                    
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.microphone = this.audioContext.createMediaStreamSource(stream);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 4096;
                    this.analyser.smoothingTimeConstant = 0.3;
                    this.microphone.connect(this.analyser);
                    
                    this.pitchDetector = new PitchDetector(this.audioContext, this.audioContext.sampleRate);
                    this.midiConverter = new MidiConverter();
                    this.isRecording = true;
                    this.startTime = Date.now();
                    
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    document.getElementById('clearBtn').disabled = true;
                    this.updateStatus('Recording... Start humming!');
                    this.processAudio();
                    
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    this.updateStatus('Error: Could not access microphone. Please check permissions.');
                }
            }

            stopRecording() {
                if (!this.isRecording) return;
                this.isRecording = false;
                
                if (this.microphone) {
                    this.microphone.disconnect();
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
                
                if (this.midiConverter) {
                    const currentTime = (Date.now() - this.startTime) / 1000;
                    this.midiConverter.finalize(currentTime);
                }
                
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('clearBtn').disabled = false;
                document.getElementById('downloadMidiBtn').disabled = false;
                
                this.updateStatus('Recording stopped. Notes detected!');
                this.updateNotesDisplay();
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            processAudio() {
                if (!this.isRecording) return;
                
                const bufferLength = this.analyser.fftSize;
                const dataArray = new Float32Array(bufferLength);
                this.analyser.getFloatTimeDomainData(dataArray);
                
                const pitchResult = this.pitchDetector.detectPitch(dataArray);
                const currentTime = (Date.now() - this.startTime) / 1000;
                
                this.midiConverter.processPitchDetection(pitchResult, currentTime);
                this.updatePitchDisplay(pitchResult);
                this.updateAudioLevel(pitchResult.volume);
                
                this.animationId = requestAnimationFrame(() => this.processAudio());
            }

            updatePitchDisplay(pitchResult) {
                const noteElement = document.getElementById('currentNote');
                const freqElement = document.getElementById('currentFreq');
                
                if (pitchResult.note && pitchResult.confidence > 0.4) {
                    noteElement.textContent = `${pitchResult.note.name}${pitchResult.note.octave}`;
                    freqElement.textContent = `${pitchResult.frequency.toFixed(1)} Hz`;
                    noteElement.style.color = '#4CAF50';
                } else {
                    noteElement.textContent = '-';
                    freqElement.textContent = '- Hz';
                    noteElement.style.color = '#ccc';
                }
            }

            updateAudioLevel(volume) {
                const levelBar = document.getElementById('audioLevelBar');
                const percentage = Math.min(100, volume * 1000);
                levelBar.style.width = `${percentage}%`;
            }

            updateStatus(message) {
                document.getElementById('statusText').textContent = message;
            }

            updateNotesDisplay() {
                const notesList = document.getElementById('notesList');
                const notes = this.midiConverter.getNotes();
                
                if (notes.length === 0) {
                    notesList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">No notes detected yet</div>';
                    return;
                }
                
                notesList.innerHTML = notes.map(note => {
                    const noteName = this.midiConverter.midiNumberToNoteName(note.midi);
                    const duration = note.duration.toFixed(2);
                    return `<div class="note-item">${noteName} <span style="background: rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">${duration}s</span></div>`;
                }).join('');
            }

            clearNotes() {
                if (this.midiConverter) {
                    this.midiConverter.clear();
                }
                this.updateNotesDisplay();
                document.getElementById('downloadMidiBtn').disabled = true;
                this.updateStatus('Notes cleared');
            }

            downloadMidi() {
                if (!this.midiConverter) {
                    alert('No recording available. Please record a melody first.');
                    return;
                }
                
                try {
                    const midiDataUri = this.midiConverter.generateMidiFile();
                    if (!midiDataUri) {
                        alert('No notes to export! Please record a melody first.');
                        return;
                    }
                    
                    const link = document.createElement('a');
                    link.href = midiDataUri;
                    link.download = `hummed-melody-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.mid`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    this.updateStatus('MIDI file downloaded!');
                } catch (error) {
                    console.error('Error generating MIDI:', error);
                    alert('Error generating MIDI file: ' + error.message);
                }
            }
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new HumToMidiApp();
        });
    </script>
</body>
</html>
