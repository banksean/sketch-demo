<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hum to MIDI Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.1rem; opacity: 0.9; }
        main { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .controls { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; min-width: 120px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.primary { background: #4CAF50; color: white; }
        .btn.primary:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
        .btn.secondary { background: #f44336; color: white; }
        .btn.secondary:hover:not(:disabled) { background: #da190b; transform: translateY(-2px); }
        .btn.success { background: #2196F3; color: white; }
        .btn.success:hover:not(:disabled) { background: #1976D2; transform: translateY(-2px); }
        .status { text-align: center; margin-bottom: 25px; }
        #statusText { font-size: 1.1rem; margin-bottom: 10px; font-weight: 500; }
        .audio-level { width: 300px; height: 20px; background: #e0e0e0; border-radius: 10px; margin: 0 auto; overflow: hidden; }
        .level-bar { height: 100%; background: linear-gradient(90deg, #4CAF50, #FFC107, #f44336); width: 0%; transition: width 0.1s ease; border-radius: 10px; }
        .current-note { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; font-size: 1.2rem; }
        .label { font-weight: 600; color: #666; }
        .note-value { font-size: 2rem; font-weight: bold; color: #2196F3; min-width: 80px; text-align: center; }
        .freq-value { color: #666; font-size: 1rem; }
        .detected-notes h3 { margin-bottom: 15px; color: #333; text-align: center; }
        .notes-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 50px; padding: 20px; background: #f5f5f5; border-radius: 8px; border: 1px dashed #ccc; }
        .note-item { background: #2196F3; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .harmony-controls { background: #f0f0f0; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .harmony-controls h3 { margin-bottom: 15px; color: #333; text-align: center; }
        .harmony-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 20px; flex-wrap: wrap; }
        .toggle-label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .toggle-label input[type="checkbox"] { transform: scale(1.2); }
        .current-chord { display: flex; align-items: center; gap: 10px; }
        .chord-value { font-size: 1.5rem; font-weight: bold; color: #2196F3; min-width: 60px; }
        .key-value { font-size: 1.2rem; font-weight: bold; color: #4CAF50; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-weight: 600; color: #666; min-width: 60px; }
        .control-group select { padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; }
        .control-group input[type="range"] { width: 80px; }
        .key-display { text-align: center; padding: 10px; background: white; border-radius: 8px; }
        @media (max-width: 768px) { .harmony-row { flex-direction: column; align-items: stretch; } .control-group { justify-content: space-between; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hum to MIDI Converter</h1>
            <p>Hum into your microphone and watch it convert to musical notation!</p>
        </header>
        <main>
            <div class="controls">
                <button id="startBtn" class="btn primary">Start Recording</button>
                <button id="stopBtn" class="btn secondary" disabled>Stop Recording</button>
                <button id="clearBtn" class="btn secondary">Clear</button>
                <button id="downloadMidiBtn" class="btn success" disabled>Download MIDI</button>
            </div>
            
            <div class="harmony-controls">
                <h3>Real-time Harmony</h3>
                <div class="harmony-row">
                    <label class="toggle-label">
                        <input type="checkbox" id="harmonyEnabled"> Enable Harmony
                    </label>
                    <div class="current-chord">
                        <span class="label">Current Chord:</span>
                        <span id="currentChord" class="chord-value">-</span>
                    </div>
                </div>
                <div class="harmony-row">
                    <div class="control-group">
                        <label>Style:</label>
                        <select id="harmonyStyle">
                            <option value="pop">Pop</option>
                            <option value="jazz">Jazz</option>
                            <option value="classical">Classical</option>
                            <option value="folk">Folk</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Speed:</label>
                        <select id="harmonySpeed">
                            <option value="slow">Slow</option>
                            <option value="medium" selected>Medium</option>
                            <option value="fast">Fast</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Complexity:</label>
                        <select id="harmonyComplexity">
                            <option value="simple" selected>Simple</option>
                            <option value="rich">Rich</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Volume:</label>
                        <input type="range" id="harmonyVolume" min="0" max="100" value="30">
                    </div>
                </div>
                <div class="key-display">
                    <span class="label">Detected Key:</span>
                    <span id="currentKey" class="key-value">-</span>
                </div>
            </div>
            <div class="status">
                <div id="statusText">Click "Start Recording" to begin</div>
                <div class="audio-level">
                    <div id="audioLevelBar" class="level-bar"></div>
                </div>
            </div>
            <div class="current-note">
                <span class="label">Current Note:</span>
                <span id="currentNote" class="note-value">-</span>
                <span id="currentFreq" class="freq-value">- Hz</span>
            </div>
            <div class="detected-notes">
                <h3>Detected Notes</h3>
                <div id="notesList" class="notes-list"></div>
            </div>
        </main>
    </div>
    
    <script>
        // Simple MIDI file generator
        class SimpleMidiGenerator {
            constructor() {
                this.ticksPerQuarter = 480;
            }

            generateMidiFile(notes) {
                if (!notes || notes.length === 0) {
                    return null;
                }

                const header = this.createMidiHeader();
                const track = this.createMidiTrack(notes);
                const midiData = this.combineArrays(header, track);
                return this.arrayToDataUri(midiData);
            }

            createMidiHeader() {
                return [
                    0x4D, 0x54, 0x68, 0x64,
                    0x00, 0x00, 0x00, 0x06,
                    0x00, 0x00,
                    0x00, 0x01,
                    0x01, 0xE0
                ];
            }

            createMidiTrack(notes) {
                const trackData = [];
                trackData.push(...[0x4D, 0x54, 0x72, 0x6B]);
                const lengthPosition = trackData.length;
                trackData.push(0x00, 0x00, 0x00, 0x00);
                
                const trackEvents = [];
                trackEvents.push(...this.createTempoEvent());
                
                const sortedNotes = [...notes].sort((a, b) => a.startTime - b.startTime);
                let currentTime = 0;
                
                sortedNotes.forEach(note => {
                    const startTicks = Math.round(note.startTime * this.ticksPerQuarter * 2);
                    const durationTicks = Math.round(note.duration * this.ticksPerQuarter * 2);
                    const deltaTime = startTicks - currentTime;
                    
                    trackEvents.push(...this.encodeVariableLength(deltaTime));
                    trackEvents.push(0x90, note.midi, note.velocity || 80);
                    trackEvents.push(...this.encodeVariableLength(durationTicks));
                    trackEvents.push(0x80, note.midi, 0x40);
                    
                    currentTime = startTicks + durationTicks;
                });
                
                trackEvents.push(0x00, 0xFF, 0x2F, 0x00);
                trackData.push(...trackEvents);
                
                const trackLength = trackEvents.length;
                trackData[lengthPosition] = (trackLength >> 24) & 0xFF;
                trackData[lengthPosition + 1] = (trackLength >> 16) & 0xFF;
                trackData[lengthPosition + 2] = (trackLength >> 8) & 0xFF;
                trackData[lengthPosition + 3] = trackLength & 0xFF;
                
                return trackData;
            }

            createTempoEvent() {
                const microsecondsPerQuarter = Math.round(60000000 / 120);
                return [
                    0x00,
                    0xFF, 0x51, 0x03,
                    (microsecondsPerQuarter >> 16) & 0xFF,
                    (microsecondsPerQuarter >> 8) & 0xFF,
                    microsecondsPerQuarter & 0xFF
                ];
            }

            encodeVariableLength(value) {
                const result = [];
                result.unshift(value & 0x7F);
                value >>= 7;
                while (value > 0) {
                    result.unshift((value & 0x7F) | 0x80);
                    value >>= 7;
                }
                return result;
            }

            combineArrays(...arrays) {
                const result = [];
                for (const array of arrays) {
                    result.push(...array);
                }
                return result;
            }

            arrayToDataUri(byteArray) {
                const binaryString = String.fromCharCode.apply(null, byteArray);
                const base64 = btoa(binaryString);
                return `data:audio/midi;base64,${base64}`;
            }
        }

        // Pitch detector
        class PitchDetector {
            constructor(audioContext, sampleRate = 44100) {
                this.audioContext = audioContext;
                this.sampleRate = sampleRate;
                this.bufferSize = 4096;
                this.threshold = 0.01;
                this.noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            }

            detectPitch(audioBuffer) {
                const data = new Float32Array(audioBuffer);
                const volume = this.getVolume(data);
                if (volume < this.threshold) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }

                this.applyHammingWindow(data);
                const autocorrelation = this.autocorrelate(data);
                const period = this.findBestPeriod(autocorrelation);
                
                if (period === -1) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }
                
                const frequency = this.sampleRate / period;
                if (frequency < 80 || frequency > 1000) {
                    return { frequency: 0, note: null, confidence: 0, volume };
                }
                
                const note = this.frequencyToNote(frequency);
                const confidence = autocorrelation[period];
                
                return { frequency, note, confidence, volume };
            }

            getVolume(data) {
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i] * data[i];
                }
                return Math.sqrt(sum / data.length);
            }

            applyHammingWindow(data) {
                for (let i = 0; i < data.length; i++) {
                    data[i] *= 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (data.length - 1));
                }
            }

            autocorrelate(data) {
                const autocorrelation = new Float32Array(data.length);
                
                for (let lag = 0; lag < data.length; lag++) {
                    let sum = 0;
                    for (let i = 0; i < data.length - lag; i++) {
                        sum += data[i] * data[i + lag];
                    }
                    autocorrelation[lag] = sum / (data.length - lag);
                }
                
                const maxVal = Math.max(...autocorrelation);
                if (maxVal > 0) {
                    for (let i = 0; i < autocorrelation.length; i++) {
                        autocorrelation[i] /= maxVal;
                    }
                }
                
                return autocorrelation;
            }

            findBestPeriod(autocorrelation) {
                const minPeriod = Math.floor(this.sampleRate / 1000);
                const maxPeriod = Math.floor(this.sampleRate / 80);
                
                let bestPeriod = -1;
                let bestCorrelation = 0.3;
                
                for (let period = minPeriod; period < Math.min(maxPeriod, autocorrelation.length); period++) {
                    if (autocorrelation[period] > bestCorrelation) {
                        if (period === 0 || 
                            (autocorrelation[period] > autocorrelation[period - 1] && 
                             autocorrelation[period] > autocorrelation[period + 1])) {
                            bestCorrelation = autocorrelation[period];
                            bestPeriod = period;
                        }
                    }
                }
                
                return bestPeriod;
            }

            frequencyToNote(frequency) {
                const A4 = 440;
                const noteNumber = Math.round(12 * Math.log2(frequency / A4) + 69);
                const octave = Math.floor((noteNumber - 12) / 12);
                const noteIndex = (noteNumber - 12) % 12;
                
                return {
                    name: this.noteNames[noteIndex],
                    octave: octave,
                    midi: noteNumber,
                    frequency: frequency
                };
            }
        }

        // MIDI converter
        class MidiConverter {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.noteStartTime = null;
                this.minNoteDuration = 0.1;
                this.pitchStabilityThreshold = 0.5;
                this.recentPitches = [];
                this.maxRecentPitches = 10;
            }

            processPitchDetection(pitchResult, timestamp) {
                const { frequency, note, confidence, volume } = pitchResult;
                
                if (!note || confidence < 0.4 || volume < 0.01) {
                    this.endCurrentNote(timestamp);
                    return;
                }

                this.recentPitches.push({ note: note.midi, timestamp, confidence });
                if (this.recentPitches.length > this.maxRecentPitches) {
                    this.recentPitches.shift();
                }

                const stablePitch = this.getStablePitch();
                if (!stablePitch) {
                    return;
                }

                if (this.currentNote && Math.abs(this.currentNote.midi - stablePitch) <= 1) {
                    return;
                }

                this.endCurrentNote(timestamp);
                this.startNewNote(stablePitch, timestamp, confidence);
            }

            getStablePitch() {
                if (this.recentPitches.length < 3) {
                    return null;
                }

                const pitchCounts = {};
                this.recentPitches.forEach(p => {
                    const roundedPitch = Math.round(p.note);
                    if (!pitchCounts[roundedPitch]) {
                        pitchCounts[roundedPitch] = { count: 0, totalConfidence: 0 };
                    }
                    pitchCounts[roundedPitch].count++;
                    pitchCounts[roundedPitch].totalConfidence += p.confidence;
                });

                let bestPitch = null;
                let bestScore = 0;
                
                for (const [pitch, data] of Object.entries(pitchCounts)) {
                    const score = (data.count / this.recentPitches.length) * (data.totalConfidence / data.count);
                    if (score > bestScore && score > this.pitchStabilityThreshold) {
                        bestScore = score;
                        bestPitch = parseInt(pitch);
                    }
                }

                return bestPitch;
            }

            startNewNote(midiNote, timestamp, confidence) {
                this.currentNote = {
                    midi: midiNote,
                    startTime: timestamp,
                    confidence: confidence
                };
                this.noteStartTime = timestamp;
            }

            endCurrentNote(timestamp) {
                if (!this.currentNote || !this.noteStartTime) {
                    return;
                }

                const duration = timestamp - this.noteStartTime;
                if (duration >= this.minNoteDuration) {
                    this.notes.push({
                        midi: this.currentNote.midi,
                        startTime: this.noteStartTime,
                        duration: duration,
                        velocity: Math.min(127, Math.max(40, Math.round(this.currentNote.confidence * 127)))
                    });
                }

                this.currentNote = null;
                this.noteStartTime = null;
            }

            finalize(timestamp) {
                this.endCurrentNote(timestamp);
                return this.notes.slice();
            }

            clear() {
                this.notes = [];
                this.currentNote = null;
                this.noteStartTime = null;
                this.recentPitches = [];
            }

            generateMidiFile(notes = null) {
                const notesToUse = notes || this.notes;
                if (notesToUse.length === 0) {
                    return null;
                }
                const midiGenerator = new SimpleMidiGenerator();
                return midiGenerator.generateMidiFile(notesToUse);
            }

            midiNumberToNoteName(midiNumber) {
                const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const octave = Math.floor((midiNumber - 12) / 12);
                const noteIndex = (midiNumber - 12) % 12;
                return noteNames[noteIndex] + octave;
            }

            getNotes() {
                return this.notes.slice();
            }
        }

        // Real-time Harmony Generation Engine (inserted here)
        class RealtimeHarmonyEngine {
            constructor(audioContext) {
                this.audioContext = audioContext;
                this.recentNotes = [];
                this.maxBufferTime = 4000;
                this.currentKey = null;
                this.currentChord = null;
                this.lastChordChange = 0;
                this.harmonicRhythm = 2000;
                this.enabled = false;
                this.style = 'pop';
                this.complexity = 'simple';
                this.harmonicSpeed = 'medium';
                this.synthNodes = [];
                this.masterGain = null;
                this.setupAudioSynthesis();
                this.initializeMusicTheory();
            }
            
            initializeMusicTheory() {
                this.keyProfiles = {
                    major: [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],
                    minor: [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17]
                };
                this.romanNumerals = {
                    'I': [0, 4, 7], 'ii': [2, 5, 9], 'iii': [4, 7, 11], 'IV': [5, 9, 0], 'V': [7, 11, 2], 'vi': [9, 0, 4],
                    'I7': [0, 4, 7, 11], 'ii7': [2, 5, 9, 0], 'V7': [7, 11, 2, 5], 'vi7': [9, 0, 4, 7]
                };
                this.noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            }
            
            setupAudioSynthesis() {
                if (!this.audioContext) return;
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = 0.15;
                this.masterGain.connect(this.audioContext.destination);
            }
            
            processNote(note, timestamp, confidence) {
                if (!this.enabled || !note) return;
                this.addNoteToBuffer(note, timestamp, confidence);
                this.cleanBuffer(timestamp);
                this.updateKeyDetection();
                if (this.shouldGenerateNewChord(timestamp)) {
                    this.generateAndPlayHarmony(timestamp);
                }
            }
            
            addNoteToBuffer(note, timestamp, confidence) {
                this.recentNotes.push({ midi: note.midi, name: note.name, octave: note.octave, timestamp, confidence });
            }
            
            cleanBuffer(currentTime) {
                const cutoffTime = currentTime - this.maxBufferTime;
                this.recentNotes = this.recentNotes.filter(note => note.timestamp > cutoffTime);
            }
            
            updateKeyDetection() {
                if (this.recentNotes.length < 5) return;
                const detectedKey = this.detectKey(this.recentNotes);
                if (detectedKey && detectedKey.confidence > 0.7) {
                    if (!this.currentKey || detectedKey.key !== this.currentKey.key || detectedKey.mode !== this.currentKey.mode) {
                        this.currentKey = detectedKey;
                        this.onKeyChange?.(this.currentKey);
                    }
                }
            }
            
            detectKey(notes) {
                const noteCounts = new Array(12).fill(0);
                notes.forEach(note => { noteCounts[note.midi % 12] += note.confidence || 1; });
                const total = noteCounts.reduce((sum, count) => sum + count, 0);
                const noteDistribution = noteCounts.map(count => count / total);
                
                let bestKey = null; let bestScore = -1;
                for (let tonic = 0; tonic < 12; tonic++) {
                    ['major', 'minor'].forEach(mode => {
                        let score = 0;
                        for (let i = 0; i < 12; i++) {
                            const keyIndex = (i - tonic + 12) % 12;
                            score += noteDistribution[i] * this.keyProfiles[mode][keyIndex];
                        }
                        if (score > bestScore) {
                            bestScore = score;
                            bestKey = { key: this.noteNames[tonic], mode, tonic, confidence: score };
                        }
                    });
                }
                return bestKey;
            }
            
            shouldGenerateNewChord(timestamp) {
                const rhythmMap = { slow: 3000, medium: 2000, fast: 1000 };
                const rhythm = rhythmMap[this.harmonicSpeed] || 2000;
                return (timestamp - this.lastChordChange) >= rhythm;
            }
            
            generateAndPlayHarmony(timestamp) {
                if (!this.currentKey) return;
                const chord = this.generateChord();
                if (chord && (!this.currentChord || chord.roman !== this.currentChord.roman)) {
                    this.currentChord = chord;
                    this.lastChordChange = timestamp;
                    this.playChord(chord);
                    this.onChordChange?.(chord);
                }
            }
            
            generateChord() {
                if (!this.currentKey || this.recentNotes.length === 0) return null;
                const recentMelody = this.recentNotes.slice(-3);
                const scaleDegrees = recentMelody.map(note => {
                    let degree = (note.midi % 12 - this.currentKey.tonic + 12) % 12;
                    const scaleIntervals = this.currentKey.mode === 'major' ? [0,2,4,5,7,9,11] : [0,2,3,5,7,8,10];
                    const index = scaleIntervals.indexOf(degree);
                    return index >= 0 ? index + 1 : null;
                }).filter(d => d !== null);
                
                if (!scaleDegrees.length) return this.getDefaultChord();
                
                const primaryDegree = scaleDegrees[scaleDegrees.length - 1]; // Use most recent
                return this.getChordForDegree(primaryDegree);
            }
            
            getChordForDegree(degree) {
                const chordMap = this.currentKey.mode === 'major' ? 
                    { 1: 'I', 2: 'ii', 3: 'iii', 4: 'IV', 5: 'V', 6: 'vi', 7: 'vii' } :
                    { 1: 'i', 2: 'ii', 3: 'III', 4: 'iv', 5: 'v', 6: 'VI', 7: 'VII' };
                let roman = chordMap[degree] || 'I';
                if (this.style === 'jazz' && ['ii', 'V', 'vi'].includes(roman)) roman += '7';
                return { roman, root: this.currentKey.tonic, notes: this.getChordNotes(roman) };
            }
            
            getDefaultChord() {
                return this.currentKey ? { roman: 'I', root: this.currentKey.tonic, notes: [this.currentKey.tonic, (this.currentKey.tonic + 4) % 12, (this.currentKey.tonic + 7) % 12] } : null;
            }
            
            getChordNotes(roman) {
                const intervals = this.romanNumerals[roman] || [0, 4, 7];
                return intervals.map(interval => (this.currentKey.tonic + interval) % 12);
            }
            
            playChord(chord) {
                if (!this.audioContext || !chord) return;
                this.stopCurrentChord();
                const now = this.audioContext.currentTime;
                const duration = 2.0;
                
                chord.notes.forEach((note, index) => {
                    const frequency = 440 * Math.pow(2, (note - 9) / 12);
                    const octaveAdjust = index === 0 ? 0 : 1;
                    const adjustedFreq = frequency * Math.pow(2, octaveAdjust);
                    this.createAndPlayTone(adjustedFreq, now, duration, 0.08 / (index + 1));
                });
            }
            
            createAndPlayTone(frequency, startTime, duration, volume) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                const filter = this.audioContext.createBiquadFilter();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, startTime);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1500, startTime);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(volume, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(volume * 0.3, startTime + duration * 0.3);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                
                osc.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
                osc.start(startTime); osc.stop(startTime + duration);
                
                this.synthNodes.push({ osc, gain, filter });
                osc.onended = () => { this.synthNodes = this.synthNodes.filter(n => n.osc !== osc); };
            }
            
            stopCurrentChord() {
                const now = this.audioContext.currentTime;
                this.synthNodes.forEach(({ osc, gain }) => {
                    try {
                        gain.gain.cancelScheduledValues(now);
                        gain.gain.setValueAtTime(gain.gain.value, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.stop(now + 0.05);
                    } catch (e) {}
                });
            }
            
            setEnabled(enabled) { this.enabled = enabled; if (!enabled) this.stopCurrentChord(); }
            setStyle(style) { this.style = style; }
            setComplexity(complexity) { this.complexity = complexity; }
            setHarmonicSpeed(speed) { this.harmonicSpeed = speed; }
            setVolume(volume) { if (this.masterGain) this.masterGain.gain.value = volume * 0.3; }
            destroy() { this.stopCurrentChord(); if (this.masterGain) this.masterGain.disconnect(); }
        }

        // Main app
        class HumToMidiApp {
            constructor() {
                this.audioContext = null;
                this.microphone = null;
                this.analyser = null;
                this.pitchDetector = null;
                this.midiConverter = null;
                this.harmonyEngine = null;
                this.isRecording = false;
                this.animationId = null;
                this.startTime = null;
                this.initializeUI();
            }

            initializeUI() {
                document.getElementById('startBtn').addEventListener('click', () => this.startRecording());
                document.getElementById('stopBtn').addEventListener('click', () => this.stopRecording());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearNotes());
                document.getElementById('downloadMidiBtn').addEventListener('click', () => this.downloadMidi());
                
                // Harmony controls
                document.getElementById('harmonyEnabled').addEventListener('change', (e) => {
                    if (this.harmonyEngine) this.harmonyEngine.setEnabled(e.target.checked);
                });
                document.getElementById('harmonyStyle').addEventListener('change', (e) => {
                    if (this.harmonyEngine) this.harmonyEngine.setStyle(e.target.value);
                });
                document.getElementById('harmonySpeed').addEventListener('change', (e) => {
                    if (this.harmonyEngine) this.harmonyEngine.setHarmonicSpeed(e.target.value);
                });
                document.getElementById('harmonyComplexity').addEventListener('change', (e) => {
                    if (this.harmonyEngine) this.harmonyEngine.setComplexity(e.target.value);
                });
                document.getElementById('harmonyVolume').addEventListener('input', (e) => {
                    if (this.harmonyEngine) this.harmonyEngine.setVolume(e.target.value / 100);
                });
                
                this.updateStatus('Click "Start Recording" to begin');
            }

            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        } 
                    });
                    
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.microphone = this.audioContext.createMediaStreamSource(stream);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 4096;
                    this.analyser.smoothingTimeConstant = 0.3;
                    this.microphone.connect(this.analyser);
                    
                    this.pitchDetector = new PitchDetector(this.audioContext, this.audioContext.sampleRate);
                    this.midiConverter = new MidiConverter();
                    
                    // Initialize harmony engine
                    this.harmonyEngine = new RealtimeHarmonyEngine(this.audioContext);
                    this.harmonyEngine.setEnabled(document.getElementById('harmonyEnabled').checked);
                    this.harmonyEngine.setStyle(document.getElementById('harmonyStyle').value);
                    this.harmonyEngine.setHarmonicSpeed(document.getElementById('harmonySpeed').value);
                    this.harmonyEngine.setComplexity(document.getElementById('harmonyComplexity').value);
                    this.harmonyEngine.setVolume(document.getElementById('harmonyVolume').value / 100);
                    
                    // Set up harmony callbacks
                    this.harmonyEngine.onChordChange = (chord) => this.updateChordDisplay(chord);
                    this.harmonyEngine.onKeyChange = (key) => this.updateKeyDisplay(key);
                    
                    this.isRecording = true;
                    this.startTime = Date.now();
                    
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    document.getElementById('clearBtn').disabled = true;
                    this.updateStatus('Recording... Start humming!');
                    this.processAudio();
                    
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    this.updateStatus('Error: Could not access microphone. Please check permissions.');
                }
            }

            stopRecording() {
                if (!this.isRecording) return;
                this.isRecording = false;
                
                if (this.microphone) {
                    this.microphone.disconnect();
                }
                if (this.harmonyEngine) {
                    this.harmonyEngine.destroy();
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
                
                if (this.midiConverter) {
                    const currentTime = (Date.now() - this.startTime) / 1000;
                    this.midiConverter.finalize(currentTime);
                }
                
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('clearBtn').disabled = false;
                document.getElementById('downloadMidiBtn').disabled = false;
                
                this.updateStatus('Recording stopped. Notes detected!');
                this.updateNotesDisplay();
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            processAudio() {
                if (!this.isRecording) return;
                
                const bufferLength = this.analyser.fftSize;
                const dataArray = new Float32Array(bufferLength);
                this.analyser.getFloatTimeDomainData(dataArray);
                
                const pitchResult = this.pitchDetector.detectPitch(dataArray);
                const currentTime = (Date.now() - this.startTime) / 1000;
                
                this.midiConverter.processPitchDetection(pitchResult, currentTime);
                this.updatePitchDisplay(pitchResult);
                this.updateAudioLevel(pitchResult.volume);
                
                // Process for harmony generation
                if (this.harmonyEngine && pitchResult.note) {
                    this.harmonyEngine.processNote(pitchResult.note, currentTime, pitchResult.confidence);
                }
                
                this.animationId = requestAnimationFrame(() => this.processAudio());
            }

            updatePitchDisplay(pitchResult) {
                const noteElement = document.getElementById('currentNote');
                const freqElement = document.getElementById('currentFreq');
                
                if (pitchResult.note && pitchResult.confidence > 0.4) {
                    noteElement.textContent = `${pitchResult.note.name}${pitchResult.note.octave}`;
                    freqElement.textContent = `${pitchResult.frequency.toFixed(1)} Hz`;
                    noteElement.style.color = '#4CAF50';
                } else {
                    noteElement.textContent = '-';
                    freqElement.textContent = '- Hz';
                    noteElement.style.color = '#ccc';
                }
            }

            updateAudioLevel(volume) {
                const levelBar = document.getElementById('audioLevelBar');
                const percentage = Math.min(100, volume * 1000);
                levelBar.style.width = `${percentage}%`;
            }

            updateStatus(message) {
                document.getElementById('statusText').textContent = message;
            }

            updateNotesDisplay() {
                const notesList = document.getElementById('notesList');
                const notes = this.midiConverter.getNotes();
                
                if (notes.length === 0) {
                    notesList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">No notes detected yet</div>';
                    return;
                }
                
                notesList.innerHTML = notes.map(note => {
                    const noteName = this.midiConverter.midiNumberToNoteName(note.midi);
                    const duration = note.duration.toFixed(2);
                    return `<div class="note-item">${noteName} <span style="background: rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">${duration}s</span></div>`;
                }).join('');
            }

            clearNotes() {
                if (this.midiConverter) {
                    this.midiConverter.clear();
                }
                if (this.harmonyEngine) {
                    this.harmonyEngine.stopCurrentChord();
                    this.harmonyEngine.currentKey = null;
                    this.harmonyEngine.currentChord = null;
                }
                this.updateNotesDisplay();
                this.updateChordDisplay(null);
                this.updateKeyDisplay(null);
                document.getElementById('downloadMidiBtn').disabled = true;
                this.updateStatus('Notes cleared');
            }
            
            updateChordDisplay(chord) {
                const chordElement = document.getElementById('currentChord');
                if (chord) {
                    const chordName = chord.root !== undefined ? 
                        this.harmonyEngine.noteNames[chord.root] + chord.roman.replace(/[IVivx]/g, match => {
                            const map = {'I':'','i':'m','V':'','v':'m','IV':'','iv':'m','ii':'m','iii':'m','vi':'m','VII':''};
                            return map[match] || '';
                        }) : chord.roman;
                    chordElement.textContent = chordName;
                    chordElement.style.color = '#2196F3';
                } else {
                    chordElement.textContent = '-';
                    chordElement.style.color = '#ccc';
                }
            }
            
            updateKeyDisplay(key) {
                const keyElement = document.getElementById('currentKey');
                if (key) {
                    keyElement.textContent = `${key.key} ${key.mode}`;
                    keyElement.style.color = '#4CAF50';
                } else {
                    keyElement.textContent = '-';
                    keyElement.style.color = '#ccc';
                }
            }

            downloadMidi() {
                if (!this.midiConverter) {
                    alert('No recording available. Please record a melody first.');
                    return;
                }
                
                try {
                    const midiDataUri = this.midiConverter.generateMidiFile();
                    if (!midiDataUri) {
                        alert('No notes to export! Please record a melody first.');
                        return;
                    }
                    
                    const link = document.createElement('a');
                    link.href = midiDataUri;
                    link.download = `hummed-melody-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.mid`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    this.updateStatus('MIDI file downloaded!');
                } catch (error) {
                    console.error('Error generating MIDI:', error);
                    alert('Error generating MIDI file: ' + error.message);
                }
            }
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new HumToMidiApp();
        });
    </script>
</body>
